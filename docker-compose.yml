services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voljsky_bereg
      POSTGRES_USER: voljsky
      POSTGRES_PASSWORD: voljsky_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voljsky -d voljsky_bereg']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://voljsky:voljsky_dev@db:5432/voljsky_bereg
    volumes:
      - media_data:/app/public/media

volumes:
  postgres_data:
  media_data:
